<!doctype html><html lang="en"><meta charset="utf-8"><title>Help control test</title><style>:root {
  color-scheme: light dark;
  --page: #f5f7fa;
  --surface: #ffffff;
  --surface-muted: #edf1f6;
  --text: #172338;
  --muted: #4d5d73;
  --border: #b8c3d1;
  --accent: #174eb5;
  --focus: #174eb5;
  --positive: #126136;
  --warning: #7b4400;
  --negative: #ac2430;
  --unknown: #60479a;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 100%;
  line-height: 1.55;
  background: var(--page);
  color: var(--text);
}

@media (prefers-color-scheme: dark) {
  :root {
    --page: #111821;
    --surface: #192330;
    --surface-muted: #243143;
    --text: #e9eef5;
    --muted: #b2bfd0;
    --border: #64758b;
    --accent: #9cc1ff;
    --focus: #b7d2ff;
    --positive: #82dba4;
    --warning: #f0c176;
    --negative: #ffabb3;
    --unknown: #c9b2ff;
  }
}

* { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
a { color: var(--accent); text-underline-offset: 0.18em; }
button, input, select, textarea { font: inherit; }
button, input, select, textarea, summary { accent-color: var(--accent); }
button, select, summary { cursor: pointer; }
button, input, select, textarea {
  min-height: 2.75rem;
  border: 1px solid var(--border);
  border-radius: 0.4rem;
  background: var(--surface);
  color: var(--text);
  padding: 0.5rem 0.75rem;
}
button:hover { background: var(--surface-muted); }
button:disabled { cursor: default; opacity: 0.6; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
h1, h2, h3 { line-height: 1.25; margin-block: 0 0.75rem; }
h1 { font-size: clamp(1.6rem, 3vw, 2.3rem); letter-spacing: -0.03em; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.05rem; }
p { margin-block: 0 1rem; }
code, pre, .identifier { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
code, .identifier { overflow-wrap: anywhere; }
pre { overflow: auto; padding: 1rem; background: var(--surface-muted); }
small, .muted { color: var(--muted); }
label { display: grid; gap: 0.35rem; }
fieldset { border: 1px solid var(--border); border-radius: 0.4rem; }
legend { padding-inline: 0.4rem; font-weight: 600; }
input[type="checkbox"], input[type="radio"] { min-height: auto; }
summary { min-height: 2.75rem; padding-block: 0.55rem; font-weight: 600; }
details > :not(summary) { margin-inline: 0.5rem; }

.skip-link {
  position: fixed;
  top: 0.5rem;
  left: 0.5rem;
  z-index: 10;
  padding: 0.75rem 1rem;
  background: var(--surface);
  transform: translateY(-200%);
}
.skip-link:focus { transform: none; }
.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.report-header, .report-main, .report-footer {
  width: min(100%, 92rem);
  margin-inline: auto;
  padding: 1.5rem clamp(1rem, 3vw, 2.5rem);
}
.report-header { display: grid; gap: 1rem; }
.report-brand { font-weight: 750; letter-spacing: 0.06em; font-size: 0.85rem; }
.report-context { display: grid; gap: 0.5rem; color: var(--muted); }
.report-context p { margin: 0; }
.report-navigation {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
  padding: 0.5rem;
  border: 1px solid var(--border);
  border-radius: 0.6rem;
  background: var(--surface);
}
.report-navigation a, .report-navigation [role="tab"] {
  display: inline-flex;
  align-items: center;
  min-height: 2.75rem;
  padding: 0.5rem 0.85rem;
  border-radius: 0.35rem;
  text-decoration: none;
}
.report-navigation [aria-current="page"], .report-navigation [aria-selected="true"] {
  background: var(--surface-muted);
  color: var(--text);
  font-weight: 700;
  box-shadow: inset 0 -3px var(--accent);
}
.report-main { padding-top: 0; }
.report-section {
  min-width: 0;
  margin-block: 0 1.25rem;
  padding: clamp(1rem, 2vw, 1.5rem);
  border: 1px solid var(--border);
  border-radius: 0.6rem;
  background: var(--surface);
  scroll-margin-block-start: 1rem;
}
.section-heading { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem 1rem; }
.summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 13rem), 1fr)); gap: 1rem; }
.summary-card { padding: 1rem; border: 1px solid var(--border); border-radius: 0.4rem; }
.summary-value { display: block; font-size: 1.75rem; font-weight: 700; line-height: 1.3; }
.summary-label { color: var(--muted); }
.toolbar { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: end; margin-block: 1rem; }
.toolbar label { flex: 1 1 13rem; }
.toolbar input, .toolbar select { width: 100%; }
.filter-summary { color: var(--muted); margin-block: 0.5rem 1rem; }
.disclosure { padding: 0.85rem 1rem; border-inline-start: 4px solid var(--border); background: var(--surface-muted); margin-block: 0.75rem; }
.disclosure p:last-child { margin-bottom: 0; }
.status { display: inline-flex; gap: 0.35rem; align-items: center; font-weight: 650; }
.status[data-tone="positive"] { color: var(--positive); }
.status[data-tone="warning"] { color: var(--warning); }
.status[data-tone="negative"] { color: var(--negative); }
.status[data-tone="unknown"] { color: var(--unknown); }
.empty-state, .unavailable-state { padding: 1rem; border: 1px dashed var(--border); border-radius: 0.4rem; }

.table-scroll { max-width: 100%; overflow: auto; border: 1px solid var(--border); border-radius: 0.4rem; }
.data-table { width: 100%; border-collapse: collapse; text-align: start; font-size: 0.94rem; }
.data-table caption { padding: 0.8rem 1rem; color: var(--muted); text-align: start; }
.data-table th, .data-table td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); vertical-align: top; }
.data-table th { background: var(--surface-muted); font-weight: 650; }
.data-table tr:last-child td { border-bottom: 0; }
.data-table th button { background: transparent; border-color: transparent; padding: 0.25rem; margin: -0.25rem; text-align: inherit; font-weight: inherit; }
.data-table .numeric { text-align: end; font-variant-numeric: tabular-nums; }
.data-table .location, .data-table .identifier { min-width: 12rem; max-width: 32rem; }
.detail-list { display: grid; grid-template-columns: minmax(8rem, 1fr) minmax(0, 3fr); gap: 0.5rem 1.5rem; }
.detail-list dt { color: var(--muted); }
.detail-list dd { margin: 0; overflow-wrap: anywhere; }
.graph-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(15rem, 22rem); gap: 1rem; }
.graph-canvas { width: 100%; min-height: 20rem; border: 1px solid var(--border); border-radius: 0.4rem; background: var(--surface); }
.graph-canvas text { fill: var(--text); font-family: inherit; }
.graph-canvas .node { fill: var(--surface-muted); stroke: var(--border); }
.graph-canvas .edge { fill: none; stroke: var(--muted); }
.graph-canvas [aria-selected="true"] .node { stroke: var(--accent); stroke-width: 3; }
.graph-alternative { margin-block-start: 1rem; }
dialog {
  width: min(42rem, calc(100% - 2rem));
  max-height: calc(100% - 2rem);
  overflow: auto;
  padding: 1.5rem;
  border: 1px solid var(--border);
  border-radius: 0.6rem;
  background: var(--surface);
  color: var(--text);
}
dialog::backdrop { background: rgb(0 0 0 / 55%); }
.dialog-actions { display: flex; justify-content: end; margin-block-start: 1rem; }
.report-footer { color: var(--muted); font-size: 0.9rem; }

@media (max-width: 48rem) {
  .graph-layout, .detail-list { grid-template-columns: minmax(0, 1fr); }
  .detail-list dd { margin-block-end: 0.5rem; }
  .report-navigation a, .report-navigation [role="tab"] { flex: 1 1 auto; justify-content: center; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
}

@media (forced-colors: active) {
  :root { --border: CanvasText; --focus: Highlight; }
  .report-navigation [aria-current="page"], .report-navigation [aria-selected="true"] { outline: 2px solid Highlight; }
  .graph-canvas .node { fill: Canvas; stroke: CanvasText; }
  .graph-canvas .edge { stroke: CanvasText; }
  .graph-canvas text { fill: CanvasText; }
}

@media print {
  :root { color-scheme: light; --page: white; --surface: white; --surface-muted: white; --text: black; --muted: #333; --border: #777; }
  .report-navigation, .toolbar, .skip-link, .dialog-actions { display: none; }
  .report-header, .report-main, .report-footer { width: 100%; padding: 0.5rem; }
  .report-section { border-radius: 0; break-inside: auto; }
  h1, h2, h3, caption { break-after: avoid; }
  .table-scroll { overflow: visible; }
  .data-table { font-size: 9pt; }
  .data-table thead { display: table-header-group; }
  .data-table tr, .summary-card, .disclosure { break-inside: avoid; }
  .graph-layout { display: block; }
  a { color: black; }
  .status[data-tone] { color: black; }
}


.report-help-dialog {
  width: min(38rem, calc(100vw - 2rem));
  max-height: calc(100dvh - 2rem);
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: 0.6rem;
  padding: 1.5rem;
  background: var(--surface);
  color: var(--text);
}
.report-help-dialog::backdrop { background: rgb(0 0 0 / 55%); }
.report-help-dialog > button { margin-block-start: 0.5rem; }
@media print { .report-help { display: none; } }
</style><body><main><h1>Evidence</h1><button id="before">Before help</button><div id="mount"></div><button id="after">After help</button></main><script type="module">/** This control does not read report data or infer evidence/assessment status. */
export function createHelpView(document, title, paragraphs) {
    const element = document.createElement("div");
    element.className = "report-help";
    const opener = document.createElement("button");
    opener.type = "button";
    opener.textContent = `About ${title}`;
    opener.setAttribute("aria-haspopup", "dialog");
    const dialog = document.createElement("dialog");
    dialog.className = "report-help-dialog";
    dialog.setAttribute("aria-label", `About ${title}`);
    const heading = document.createElement("h2");
    heading.textContent = title;
    const closeButton = document.createElement("button");
    closeButton.type = "button";
    closeButton.textContent = "Close help";
    closeButton.autofocus = true;
    dialog.append(heading);
    for (const text of paragraphs) {
        const paragraph = document.createElement("p");
        paragraph.textContent = text;
        dialog.append(paragraph);
    }
    dialog.append(closeButton);
    element.append(opener, dialog);
    let disposed = false;
    function open() {
        if (!disposed && dialog.isConnected && !dialog.open)
            dialog.showModal();
    }
    function close() {
        if (dialog.open)
            dialog.close();
    }
    function returnFocus() {
        if (!disposed && opener.isConnected)
            opener.focus();
    }
    // Native dialog supplies modal focus containment and Escape cancellation.
    opener.addEventListener("click", open);
    closeButton.addEventListener("click", close);
    dialog.addEventListener("close", returnFocus);
    return {
        element,
        dispose() {
            if (disposed)
                return;
            disposed = true;
            opener.removeEventListener("click", open);
            closeButton.removeEventListener("click", close);
            dialog.removeEventListener("close", returnFocus);
            close();
            element.remove();
        },
    };
}

window.fixture = createHelpView(document, 'Evidence scope', ['Unknown callers remain unknown.', '<img src=x onerror="window.untrustedExecuted=true">']);
document.getElementById('mount').append(window.fixture.element);
window.ready = true;
</script></body></html>
