[workspace]
resolver = "3"
members = ["."]

[package]
name = "opensip-rust-provider"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[[bin]]
name = "opensip-rust-provider"
path = "src/main.rs"

[dependencies]
opensip-contracts = { path = "../../crates/contracts", version = "=0.1.0" }
opensip-identity = { path = "../../crates/identity", version = "=0.1.0" }
