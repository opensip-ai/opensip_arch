[env]
MACOSX_DEPLOYMENT_TARGET="12.0"
CARGO_WORKSPACE_DIR={value="",relative=true}
[target.aarch64-apple-darwin]
rustflags=["-Cforce-frame-pointers=yes","-C","force-unwind-tables=yes","-C","symbol-mangling-version=v0","-C","link-args=-Wl,-undefined,dynamic_lookup","-Aunknown_lints"]
[target.'cfg(all())']
rustflags=["--cfg","tokio_unstable","-Aclippy::all"]
