[package]
name = "opensip-lifecycle"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "Apache-2.0"
[lib]
path = "src/lib.rs"
[dependencies]
opensip-platform = { path = "../platform" }

opensip-identity = { path = "../identity" }
# Law CI r5 item 2 (unit CI-2): the trust owner's evidence and CI-1's codec;
# the O1-a package policy permits this edge.
opensip-security = { path = "../security" }

# Test-only fixture features (plan r3 LD-CIP-3), forwarded to security's and
# never default: `ComponentStore::fixture` is under exactly the joint fixture
# predicate. Only this crate's own tests enable `scenario-fixtures`, from its
# dev-dependencies.
[features]
crash-matrix = ["opensip-security/crash-matrix"]
scenario-fixtures = ["opensip-security/scenario-fixtures"]

[dev-dependencies]
opensip-security = { path = "../security", features = ["scenario-fixtures"] }
