# E0 harness (throwaway probe; never product code; never a workspace member of opensip).
[package]
name = "e0-harness"
version = "0.0.0"
edition = "2021"
publish = false
build = "build.rs"

[[bin]]
name = "e0"
path = "src/main.rs"

[dependencies]
# T-wasm engine: the law's minimal set is default-features = false (no `wat`); E0 records the exact set it used.
wasmi = { version = "=2.0.0", default-features = false, features = ["std", "validate", "deterministic"] }
# T-native comparison at the runtime version E1 names; its bundled C runtime is checked against the pinned tag.
tree-sitter = { version = "=0.27.0" }
tree-sitter-language = "=0.1.8"
sha2 = { version = "0.10", default-features = false }

[build-dependencies]
cc = "1.2.63"

[profile.release]
opt-level = 3
debug = false
lto = false
codegen-units = 16
panic = "unwind"

[workspace]
