[package]
name = "opensip-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "Apache-2.0"
build = "build.rs"
[lib]
path = "src/lib.rs"
[dependencies]
getrandom = { version = "=0.4.3", default-features = false }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = { version = "=0.2.189", default-features = false }

# Test-only crash barrier points (law X9 r1 items 1 and 2). Never default and
# never enabled by any manifest: only an explicit `--features crash-matrix`
# on the matrix lane's command line reaches it. src/lib.rs refuses it in any
# build without debug assertions.
[features]
crash-matrix = []
# Test-only first-party fixture launches (law M3-D r5 item 1; unit D3a-0):
# never default; enabled only from a dependent's dev-dependencies, and
# refused in src/lib.rs in any build without debug assertions.
test-fixture = []
