[package]
name = "opensip-components"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "Apache-2.0"
description = "OpenSIP common component negotiation and supervision"

[lib]
path = "src/lib.rs"

# The selected inventory permits only opensip-contracts, opensip-identity and
# opensip-platform; each edge arrives with the law M3-D unit that uses it.
# Unit D2a (item 9): the generated `Control3Root`.
[dependencies]
opensip-contracts = { path = "../contracts" }

# Unit D2a's corpus replay reads the vendored reference corpus as JSON.
[dev-dependencies]
opensip-identity = { path = "../identity" }
