[package]
name = "opensip-components"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "Apache-2.0"
description = "OpenSIP common component negotiation and supervision"

[lib]
path = "src/lib.rs"

# The selected inventory permits only opensip-contracts, opensip-identity and
# opensip-platform; each edge arrives with the law M3-D unit that uses it.
# Unit D2a (item 9): the generated `Control3Root`. Unit D2b-1 (item 10): the
# NFC predicate and SHA-256 (LD-D2B-11), which D2a's corpus replay also uses
# to read the vendored reference corpora as JSON.
# Unit D3a-1 (items 12 to 15): the platform's spawner, reap and readiness
# wait, for the supervisor.
[dependencies]
opensip-contracts = { path = "../contracts" }
opensip-identity = { path = "../identity" }
opensip-platform = { path = "../platform" }

# Tests only: `LaunchSpec::fixture` for the supervisor's first-party fixture
# (M3-D r5 item 1; LD-D3A-9), refused by platform in any build without debug
# assertions.
[dev-dependencies]
opensip-platform = { path = "../platform", features = ["test-fixture"] }

# The supervisor's fixture child (LD-D3A-9): harness-free, so fd1 carries only
# the bytes it writes. Run by Cargo on its own, it exits at once.
[[test]]
name = "supervisor_fixture"
path = "tests/supervisor_fixture.rs"
harness = false
