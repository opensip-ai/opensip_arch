[workspace]
resolver = "3"
members = ["apps/cli", "crates/contracts", "crates/identity", "crates/evaluator", "crates/host", "crates/platform", "crates/reporting", "crates/security", "crates/lifecycle","crates/storage", "crates/components", "crates/syntax", "crates/operability"]
exclude = ["providers/rust", "tools/contracts"]

# M3-O1 item13: optimized measured instrumentation with explicit assertions.
[profile.harness]
inherits = "release"
debug-assertions = true
overflow-checks = false
