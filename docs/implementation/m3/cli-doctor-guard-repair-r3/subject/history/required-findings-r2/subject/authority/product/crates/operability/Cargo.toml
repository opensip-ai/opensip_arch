[package]
name = "opensip-operability"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "Apache-2.0"
description = "Safe operational records: the event registry, typed fields, sinks and loss accounting"

[lib]
path = "src/lib.rs"

# Law M3-O1 item 1. The only edge is platform. No build script and no
# external crate: SHA-256 and HMAC-SHA-256 are in src/hmac.rs.
[dependencies]
opensip-platform = { path = "../platform" }

# Neither feature is a default. Each is refused, in src/lib.rs, in any build
# without debug assertions. `operability-dev-sinks` is reached only by an
# explicit `--features` (item 10). `test-mints` is enabled only from a
# dependent's dev-dependencies (item 7).
[features]
operability-dev-sinks = []
harness-instrumentation = []
test-mints = []

[lints.rust]
unsafe_code = "forbid"
