[package]
name = "opensip-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "Apache-2.0"
[[bin]]
name = "opensip"
path = "src/main.rs"
[dependencies]
opensip-host = { path = "../../crates/host" }
# Law M3-O1 item 10: the binary reaches the development sink only by an
# explicit `--features operability-dev-sinks`. It does not depend on
# opensip-operability itself.
[features]
operability-dev-sinks = ["opensip-host/operability-dev-sinks"]
harness-instrumentation = ["opensip-host/harness-instrumentation"]
[dev-dependencies]
serde_json = "=1.0.151"
