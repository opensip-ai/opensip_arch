[package]
name="opensip-security"
version="0.1.0"
edition="2024"
rust-version="1.95"
publish=false
license="Apache-2.0"
description="OpenSIP host security owners; private trust-time kernel draft"
[dependencies]
rusqlite={version="=0.40.2",default-features=false,features=["bundled","limits"]}
opensip-evaluator={path="../evaluator"}
opensip-platform={path="../platform"}
opensip-identity={path="../identity"}
unicode-normalization={version="=0.1.24",default-features=false}
ed25519-dalek={version="=3.0.0",default-features=false}
# Test-only features (law X9 r1 items 1, 2 and 6; law X8 r3 items 4a, 4b and
# 4f). Neither is default, and neither is named by a `[dependencies]` table.
# `crash-matrix` is reached only by an explicit `--features crash-matrix`, and
# src/lib.rs refuses it in any build without debug assertions.
# `scenario-fixtures` compiles the `scenario` module (unit X8b); only
# storage's and host's `[dev-dependencies]` enable it.
[features]
crash-matrix = ["opensip-platform/crash-matrix"]
scenario-fixtures = []
[lints.rust]
unsafe_code="forbid"
